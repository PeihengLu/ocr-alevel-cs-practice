# Optional local MySQL for PortableLeetcode app storage.
# Portable bundled mysqld is a later packaging slice — use this (or any local MySQL) for now.
#
#   docker compose up -d
#   # then npm run dev:student / dev:teacher
#
# Connection defaults match src/main/db/config.ts and .env.example.

services:
  mysql:
    image: mysql:8.4
    container_name: portable-leetcode-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portable_leetcode
      MYSQL_USER: portable
      MYSQL_PASSWORD: portable
    volumes:
      - portable_leetcode_mysql:/var/lib/mysql
      - ./sql/001_app_schema.sql:/docker-entrypoint-initdb.d/001_app_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uportable", "-pportable"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  portable_leetcode_mysql:
