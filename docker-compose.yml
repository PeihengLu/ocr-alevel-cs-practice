# OPTIONAL / secondary local MySQL for developers who prefer containers.
# On this Mac, Docker Desktop is unreliable — prefer Homebrew MySQL (see README).
# Shipped student/teacher builds will use a BUNDLED portable mysqld (not Docker, not brew).
#
#   docker compose up -d   # only if Docker works on your machine
#
# Connection defaults match src/main/db/config.ts and .env.example.

services:
  mysql:
    image: mysql:8.4
    container_name: portable-leetcode-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portable_leetcode
      MYSQL_USER: portable
      MYSQL_PASSWORD: portable
    volumes:
      - portable_leetcode_mysql:/var/lib/mysql
      - ./sql/000_exercise_db.sql:/docker-entrypoint-initdb.d/000_exercise_db.sql:ro
      - ./sql/001_app_schema.sql:/docker-entrypoint-initdb.d/001_app_schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uportable", "-pportable"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  portable_leetcode_mysql:
